# harmonicr smtp-router — rootless Podman compose for the solo VM.
# Runs under the deploy user, joined to the shared 'zitadel' bridge network so
# downstream apps (Zulip/Zitadel/Vaultwarden/Wiki.js) can reach the SMTP relay
# by container name. Caddy fronts smtp.harmonicr.com (HTTP + the public SMTP
# port). The router reaches auth.harmonicr.com (OIDC) via caddy-tls on the
# same network through extra_hosts.
services:
  smtp-router:
    image: ghcr.io/thomasteoh/smtp-router:latest
    container_name: smtp-router
    restart: unless-stopped
    userns_mode: keep-id:uid=10001,gid=10001
    command: ["serve", "-config", "/opt/smtp-router/config.json", "-addr", ":52150", "-smtp-addr", ":52151", "-db", "/opt/smtp-router-data/smtp-router.db"]
    environment:
      SMTP_ROUTER_ADMIN_TOKEN: ${SMTP_ROUTER_ADMIN_TOKEN}
      SMTP_ROUTER_DEFAULT_DAY: ${SMTP_ROUTER_DEFAULT_DAY}
      SMTP_ROUTER_DEFAULT_MONTH: ${SMTP_ROUTER_DEFAULT_MONTH}
    volumes:
      # Config dir is writable so admin mutations (add-provider/account/client,
      # add-rule) can persist via Config.Save back to config.json. :Z relabels
      # the bind mount for the container's SELinux context (container_t can
      # write container_file_t; without :Z the usr_t context denies writes).
      - /opt/smtp-router:/opt/smtp-router:rw,Z
      - smtp-router-data:/opt/smtp-router-data:Z
    extra_hosts:
      # OIDC discovery + token verification hit auth.harmonicr.com, which
      # resolves to the host public IP (hairpin-blocked from the bridge). Route
      # it through caddy-tls on the shared network instead.
      - "auth.harmonicr.com:10.89.2.193"
    networks:
      - zitadel
    ports:
      # HTTP API (52150) — Caddy proxies smtp.harmonicr.com -> container:52150.
      # SMTP relay (52151) — downstream apps reach it by container name on the
      # zitadel network; external apps reach it via the published host port.
      - "52150:52150"
      - "52151:52151"
    healthcheck:
      # The runtime is scratch (no shell/wget), so exec the binary's health
      # subcommand directly against the mounted DB.
      test: ["CMD", "/smtp-router", "health", "-db", "/opt/smtp-router-data/smtp-router.db"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  zitadel:
    external: true

volumes:
  smtp-router-data:
