# harmonicr smtp-router — rootless Podman compose for the solo VM.
# Runs under the deploy user, host networking, Caddy fronts smtp.harmonicr.com.
services:
  smtp-router:
    image: ghcr.io/thomasteoh/smtp-router:latest
    container_name: smtp-router
    restart: unless-stopped
    network_mode: host
    command: ["serve", "-config", "/opt/smtp-router/config.json", "-addr", ":8080", "-db", "/opt/smtp-router-data/smtp-router.db"]
    environment:
      EMAIL_ROUTER_ADMIN_TOKEN: ${EMAIL_ROUTER_ADMIN_TOKEN}
      EMAIL_ROUTER_DEFAULT_DAY: ${EMAIL_ROUTER_DEFAULT_DAY}
      EMAIL_ROUTER_DEFAULT_MONTH: ${EMAIL_ROUTER_DEFAULT_MONTH}
    volumes:
      - /opt/smtp-router:/opt/smtp-router:ro
      - smtp-router-data:/opt/smtp-router-data
    ports:
      # Caddy terminates TLS at smtp.harmonicr.com and proxies here.
      - "52150:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  smtp-router-data:
